name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foreman
          POSTGRES_PASSWORD: foreman
          POSTGRES_DB: foreman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foreman"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://foreman:foreman@localhost:5432/foreman_test
      TEST_DATABASE_URL: postgresql+asyncpg://foreman:foreman@localhost:5432/foreman_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Зависимости
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check . && ruff format --check .
      - name: Миграции применяются, откатываются и совпадают с моделями
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Тесты
        run: pytest -q
