[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prorab-bot"
version = "0.1.0"
description = "Telegram-бот для прорабов: приём фото, текста и голосовых с объекта, расшифровка и ежедневные отчёты"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "pillow>=10.4",
    "redis>=5",
    "sentry-sdk>=2",
]

[project.optional-dependencies]
# Локальная расшифровка голосовых без внешних API
local-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Сигнатуры с timeout навязаны интерфейсами aiogram
ignore = ["ASYNC109"]
