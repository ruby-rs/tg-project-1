x-app: &app
  build:
    context: .
    args:
      LOCAL_WHISPER: ${LOCAL_WHISPER:-0}
  image: prorab-bot:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foreman}:${POSTGRES_PASSWORD:-foreman}@db:5432/${POSTGRES_DB:-foreman}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foreman}
      POSTGRES_USER: ${POSTGRES_USER:-foreman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foreman}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    command: ["python", "-m", "app", "bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app", "worker"]
    volumes:
      - media:/data/media
      - models:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:  # архив фото и голосовых — обязательно включить в бэкап
  models: # кеш моделей Whisper
